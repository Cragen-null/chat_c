<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Bella Chat</title>
  <link rel="stylesheet" href="/static/Style.css">
</head>
<body>
  <video id="character-video" autoplay loop muted>
    <source src="/static/video_resources/idle.mp4" type="video/mp4">
    動画を再生できません。
  </video>
  <video id="character-video-next" autoplay loop muted></video>

  <div id="chat-container">
    <div id="messages"></div>
    <div id="volume-bar"><div id="volume-fill"></div></div>
    <div id="input-container">
      <input type="text" id="user-input" placeholder="メッセージを入力...">
      <button id="send-btn">送信</button>
      <button id="mic-btn">🎤</button>
    </div>
  </div>

  <script type="module">
    const videoA = document.getElementById("character-video");
const videoB = document.getElementById("character-video-next");
let currentVideo = videoA; // 現在表示中のvideo
let nextVideo = videoB;    // 切り替え先video

async function smoothVideoSwitch(newSrc, loop = true) {
  const fadeOutVideo = currentVideo;
  const fadeInVideo = nextVideo;

  fadeInVideo.src = newSrc;
  fadeInVideo.loop = loop;
  await fadeInVideo.play().catch(()=>{});

  // 🔁 クロスフェード
  fadeInVideo.style.opacity = "1";
  fadeOutVideo.style.opacity = "0";

  // 🔄 0.6秒後に入れ替え
  await new Promise(r => setTimeout(r, 500));

  // 完全に切り替わったら役割をスワップ
  const temp = currentVideo;
  currentVideo = nextVideo;
  nextVideo = temp;
}

    window.onload = () => {
      playIdleAnimation();
    };
    // ✉️ テキスト送信対応 =============================
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");

    // 送信ボタン押下
    sendBtn.addEventListener("click", sendTextMessage);

    // Enterキーでも送信
    userInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendTextMessage();
      }
    });

    async function sendTextMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage("user", text);
      userInput.value = "";
      appendMessage("assistant", "💭 応答中...");

      try {
        // Whisperではなく、テキスト用のエンドポイントへ送信
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });

        const data = await res.json();
        messagesDiv.lastChild.textContent = data.reply;

        playTalkAnimation();

        // 音声が含まれている場合は再生
        if (data.audio) {
          await playAudio(data.audio, "audio/mp3");
        } else {
          backToIdle();
          }
      } catch (err) {
        console.error("💥 テキスト送信エラー:", err);
        appendMessage("assistant", "⚠️ 通信エラーが発生しました。");
      }
    }

    let audioContext, analyser, micStream, mediaRecorder;
    let isRecording = false, isPlaying = false, silenceStart = null, volumeHistory = [];

    const silenceThreshold = 0.04;
    const silenceDuration = 1200;
    const historyLength = 5;

    const messagesDiv = document.getElementById("messages");
    const volumeFill = document.getElementById("volume-fill");
    const micBtn = document.getElementById("mic-btn");

    // 🎤 マイクボタンでオンオフ
    micBtn.addEventListener("click", async () => {
      if (!micStream) {
        await initAudioMonitor();
        micBtn.textContent = "🎙️監視中";
      } else {
        stopMicMonitor();
        micBtn.textContent = "🎤";
      }
    });

    // ページロード時に事前キャッシュ開始
    window.addEventListener("DOMContentLoaded", async () => {
      console.log("🚀 Bella Chat起動 - リアクション音プリロード開始");
      await preloadReactionsFromServer();
      console.log("✨ プリロード完了");
    });

    // 🔊 マイク監視
    async function initAudioMonitor() {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          noiseSuppression: true,
          echoCancellation: true,
          autoGainControl: false,
        }
      });
      audioContext = new AudioContext();
      const source = audioContext.createMediaStreamSource(micStream);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function checkVolume() {
        analyser.getByteFrequencyData(dataArray);
        const volume = dataArray.reduce((a, b) => a + b, 0) / dataArray.length / 255;

        volumeHistory.push(volume);
        if (volumeHistory.length > historyLength) volumeHistory.shift();
        const avgVolume = volumeHistory.reduce((a, b) => a + b, 0) / volumeHistory.length;

        volumeFill.style.width = `${Math.min(avgVolume * 500, 100)}%`;

        if (!isPlaying) {
          if (avgVolume > silenceThreshold) {
            silenceStart = null;
            if (!isRecording) startRecording();
          } else if (isRecording) {
            if (!silenceStart) silenceStart = Date.now();
            else if (Date.now() - silenceStart > silenceDuration) {
              // 🎯 非同期でリアクション音を即再生
              setTimeout(() => playQuickReaction(), 0);
              stopRecording();
            }
          }
        }

        requestAnimationFrame(checkVolume);
      }
      checkVolume();
    }

    // 🎙️ 録音開始
    async function startRecording() {
      if (isRecording) return;
      isRecording = true;
      isListening = true;

      playListeningAnimation();

      if (!micStream) await initAudioMonitor();  

      const recorder = new MediaRecorder(micStream);
      mediaRecorder = recorder;
      const chunks = [];
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        const blob = new Blob(chunks, { type: "audio/webm" });
        const formData = new FormData();
        formData.append("file", blob, "recorded.webm");

        appendMessage("assistant", "🎧 音声処理中...");

        try {
          // 🎯 Whisper処理とリアクション音を同時に開始
          const whisperPromise = fetch("/whisper", { method: "POST", body: formData });
          const reactionPromise = playQuickReaction(); // 録音停止と同時に反応音

          // Whisperの結果を取得
          const res = await whisperPromise;
          const data = await res.json();

          appendMessage("user", data.user_text);
          appendMessage("assistant", data.reply);
          playTalkAnimation();

          const audioPromise = playAudio(data.audio);

          await Promise.all([reactionPromise, audioPromise]);

          // リアクション音再生がまだ終わっていなければ待つ
          await reactionPromise;
        } catch (e) {
          appendMessage("assistant", "エラーが発生しました");
          console.error(e);
        } finally {
          isListening = false;
          playIdleAnimation();
        }
      };
      recorder.start();

    }

    // 🛑 録音停止
    function stopRecording() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
      }
    }

    // 🗣️ リアクション音再生関数
    // =======================================
    // 🌸 Aivisリアクション即時再生システム
    // =======================================

    const BASE_URL = "http://127.0.0.1:10101";
    const STYLE_ID = "888753763";
    const reactions = ["はい", "う～ん", "えっと", "ん〜", "そうですね", "なるほど", "了解", "わかりました", "えへへ"];
    const cachedReactions = {}; // キャッシュ用

    // 起動時キャッシュロード（バックエンドのプリ生成音を取得）
    async function preloadReactionsFromServer() {
      try {
        const resList = await Promise.all(
          reactions.map((r) => fetch(`/reaction?text=${encodeURIComponent(r)}`))
        );

        for (const res of resList) {
          if (!res.ok) continue;
          const data = await res.json();
          if (data.audio) {
            const blob = base64ToBlob(data.audio, "audio/wav");
            cachedReactions[data.text] = URL.createObjectURL(blob);
            console.log(`✅ ${data.text}（サーバーキャッシュ）を読み込み`);
          }
        }
      } catch (err) {
        console.warn("⚠️ リアクションサーバーキャッシュ読み込み失敗:", err);
      }
    }

    // Base64 → Blob変換
    function base64ToBlob(base64, type = "audio/wav") {
      const binary = atob(base64);
      const len = binary.length;
      const buffer = new Uint8Array(len);
      for (let i = 0; i < len; i++) buffer[i] = binary.charCodeAt(i);
      return new Blob([buffer], { type });
    }

    // 即時再生（キャッシュ利用）
    async function playQuickReaction() {
      if (Math.random() > 0.6) return; // 反応率40%

      const keys = Object.keys(cachedReactions);
      const chosen = keys.length > 0
        ? keys[Math.floor(Math.random() * keys.length)]
        : reactions[Math.floor(Math.random() * reactions.length)];

      if (cachedReactions[chosen]) {
        // キャッシュ再生
        const audio = new Audio(cachedReactions[chosen]);
        audio.play();
        console.log("🎧 即時リアクション:", chosen);
      } else {
        // キャッシュなし → サーバーから取得
        console.warn(`⚠️ ${chosen} 未キャッシュ → サーバー呼び出し`);
        try {
          const res = await fetch(`/reaction?text=${encodeURIComponent(chosen)}`);
          const data = await res.json();
          if (data.audio) {
            const blob = base64ToBlob(data.audio);
            const url = URL.createObjectURL(blob);
            cachedReactions[chosen] = url;
            new Audio(url).play();
          }
        } catch (err) {
          console.error("⚠️ フォールバック失敗:", err);
        }
      }
    }

    // 一時生成（キャッシュにない場合）
    async function playQuickReaction_Fallback() {
      const chosen = reactions[Math.floor(Math.random() * reactions.length)];
      try {
        const queryRes = await fetch(`${BASE_URL}/audio_query?text=${encodeURIComponent(chosen)}&speaker=${STYLE_ID}`, {
          method: "POST",
        });
        const query = await queryRes.json();

        const synthRes = await fetch(`${BASE_URL}/synthesis?speaker=${STYLE_ID}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(query),
        });
        const blob = await synthRes.blob();

        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        audio.play();
      } catch (err) {
        console.warn("⚠️ AivisSpeechリアクション生成失敗:", err);
      }
    }
    

    // 🔊 音声再生（AI応答）
    async function playAudio(base64, mime = "audio/wav") {
      if (!base64) {
        backToIdle();
        return;
      }

      isPlaying = true;

      const isDataUri = base64.startsWith?.("data:");
      let url;
      if (isDataUri) {
        url = base64;
      } else {
      const blob = base64ToBlob(base64, mime);
      url = URL.createObjectURL(blob);
      }
      
      const audio = new Audio(url);

      playTalkAnimation();

      audio.onended = () => {
        isPlaying = false;
        if (!isDataUri){
          try {URL.revokeObjectURL(url); } catch (e) {/* ignore */} // メモリ解放
      }
      backToIdle();
    };

    try {
      await audio.play();
    } catch (e) {
      console.warn("⚠️ 音声自動再生失敗:", e);
      isPlaying = false;
      if (!isDataUri) {
        try {URL.revokeObjectURL(url); } catch (e) {}
      }
      backToIdle();
    }
  }
    

    // 💬 メッセージ追加
    function appendMessage(role, text) {
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.textContent = text;
      messagesDiv.appendChild(div);
      messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    const videoElement = document.getElementById("character-video");
    
    //movieList
    const idleVideos = [
      "/static/video_resources/idle.mp4",
      "/static/video_resources/idle2.mp4",
      "/static/video_resources/idle3.mp4",
    ]

    let idleIndex = 0;
    let isTalking = false;
    let idleTimer = null;
    let isListening = false;

    async function playTalkAnimation(){
      if (isTalking) return;
      isTalking = true;
      clearTimeout(idleTimer);

      await smoothVideoSwitch("/static/video_resources/talk.mp4", true);
    }

    async function playIdleAnimation(){
      if (isTalking) return;

      await smoothVideoSwitch(idleVideos[idleIndex], true);

      startIdleLoop();
    }

    function startIdleLoop(){
      clearTimeout(idleTimer);
      const nextChange = 3000 + Math.random() *5000; //

      idleTimer = setTimeout(async () => {
        if (!isTalking){
          idleIndex = (idleIndex + 1) % idleVideos.length;
          await smoothVideoSwitch(idleVideos[idleIndex], true);
        }
        startIdleLoop();
      }, nextChange);
    }

    async function backToIdle(){
      isTalking = false;
      await playIdleAnimation();
    }


     async function playListeningAnimation(){
      const video = document.getElementById("character-video");
      if (video.src.includes("listening.mp4")) return;

      await smoothVideoSwitch("/static/video_resources/listening.mp4", true);
      
    }



  </script>
</body>
</html>
